[project]
name = "todoist-assistant"
version = "0.4.1"
description = "Interactive Dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.6,<1.0.0",
    "joblib>=1.5.0",
    "loguru>=0.7.3",
    "numpy>=2.2.5",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "plotly>=6.0.1",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "tqdm>=4.67.1",
    "typer>=0.15.3",
    "uvicorn>=0.32.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.11.9",
]
build = [
    "pyinstaller>=6.10.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29.5",
    "nbformat>=5.10.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["todoist", "todoist.*"]

[tool.coverage.run]
branch = true
source = ["todoist"]
omit = [
    "todoist/**/__init__.py",
    "todoist/core/version.py",
]

[tool.coverage.report]
omit = [
    "todoist/**/__init__.py",
    "todoist/core/version.py",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "except ImportError:",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["F"]

[tool.ruff.lint.per-file-ignores]
"todoist/web/api.py" = [
    # The legacy API module imports shared names that are synced into split route/component modules.
    "F401",
]
"todoist/web/api_components/*.py" = [
    # Component modules receive shared API helpers through _sync_api_globals at call time.
    "F821",
]
"todoist/web/routes/*.py" = [
    # Route modules receive shared API helpers through _sync_api_globals at request time.
    "F821",
]
