description: "Daily executive summary, end-of-day brief, or comparison with the previous day (read-only)."
content: |
  Call print(executive_summary(period="day")) first. The helper uses mapped dashboard project names.
  Present a compact executive brief:
  - Headline: the day's main delivery outcome.
  - Scorecard: completed, added, updated, deleted, and total events versus the previous day.
  - Focus: leading mapped projects and notable completed tasks.
  - Risks: backlog pressure, cleanup/churn, or fragmented focus; label interpretations as inference.
  - Tomorrow: 1-3 decision-oriented priorities grounded in the observed data.
  State the exact date and timezone. Avoid raw project IDs and avoid listing routine events exhaustively.
  When comparisonMode is elapsed_to_elapsed, say today is partial and yesterday is cut to the same
  local time. Do not compare a partial day with a full previous day.
