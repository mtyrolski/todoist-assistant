description: "Weekly executive productivity summary or week-over-week project comparison (read-only)."
content: |
  For a weekly summary, call print(executive_summary(period="week")) first.
  For a comparison by project, call print(project_comparison(period="week")) first.
  These helpers use mapped dashboard root names; never substitute raw parent_project_id values.
  Present an executive brief with:
  - Headline: one sentence describing the material week-over-week change.
  - Scorecard: completed, added, updated, deleted, and total events versus the previous week.
  - Project portfolio: the largest positive and negative shifts by mapped project name.
  - Delivery risks: intake exceeding completions, cleanup spikes, stalled focus, or unusual churn.
  - Decisions: 2-4 concrete priorities for the next period, clearly separated from observed facts.
  State the exact date window and timezone. Do not dump every event or invent goals from counts.
  When comparisonMode is elapsed_to_elapsed, explicitly say the active week is partial and the
  previous week is cut to the same elapsed weekday/time. Never describe it as a full-week result.
