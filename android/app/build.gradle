plugins {
    id 'com.android.application'
    id 'com.diffplug.spotless'
}

def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../frontend/package.json')).version

android {
    namespace 'com.todoistassistant'
    compileSdk 35
    defaultConfig {
        applicationId 'com.todoistassistant'
        minSdk 26
        targetSdk 35
        versionCode 401
        versionName appVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true
        unitTests.all { systemProperty 'completionFixtures', rootProject.file('../tests/fixtures/completion_scenarios.json').absolutePath } }
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-core:2.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.24.0')
        removeUnusedImports()
    }
}
