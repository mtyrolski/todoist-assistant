name: macOS Installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Attach artifacts to a tagged release
        type: boolean
        default: false
  pull_request:
    paths:
      - 'todometry/**'
      - 'todoist/**'
      - 'frontend/**'
      - 'packaging/**'
      - 'windows/**'
      - 'scripts/**'
      - 'tests/macos/**'
      - 'tests/windows/**'
      - 'tests/integration/**'
      - 'tests/fixtures/v040/**'
      - 'Formula/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/macos-installer.yml'

permissions:
  contents: read

jobs:
  build-macos-installers:
    runs-on: ${{ matrix.runner }}
    env:
      NODE_VERSION: '20.11.1'
      HOMEBREW_NO_AUTO_UPDATE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          retry() {
            local attempts="$1"
            local delay="$2"
            shift 2
            local n=1
            until "$@"; do
              if [ "${n}" -ge "${attempts}" ]; then
                echo "Command failed after ${attempts} attempts: $*" >&2
                return 1
              fi
              echo "Command failed (attempt ${n}/${attempts}); retrying in ${delay}s..." >&2
              sleep "${delay}"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }
          retry 3 5 uv sync --locked --group build

      - name: Ensure python3 shim for uv run
        run: |
          if [ ! -x .venv/bin/python3 ] && [ -x .venv/bin/python ]; then
            ln -sf python .venv/bin/python3
          fi

      - name: Version consistency check
        run: |
          uv run python3 -m scripts.check_versions

      - name: Resolve version
        run: |
          echo "TODOIST_VERSION=$(uv run python3 -m scripts.get_version)" >> "$GITHUB_ENV"
          echo "TODOIST_ARCH_SUFFIX=macos-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Build release tarball
        run: |
          mkdir -p dist/macos
          tarball="dist/macos/telemetry-for-todoist-${TODOIST_VERSION}-${TODOIST_ARCH_SUFFIX}.tar.gz"
          git archive --format=tar.gz -o "$tarball" HEAD

      - name: Build macOS pkg
        run: |
          ./scripts/build_macos_pkg.sh --output-suffix "${TODOIST_ARCH_SUFFIX}"

      - name: Build macOS app
        run: |
          ./scripts/build_macos_app.sh --prefer-system-node --node-version "${NODE_VERSION}"

      - name: Build macOS dmg
        run: |
          ./scripts/build_macos_dmg.sh --force --output-suffix "${TODOIST_ARCH_SUFFIX}"

      - name: Smoke-test frozen app with legacy state
        run: |
          uv run python3 -m scripts.smoke_frozen_app "dist/macos/TodoistAssistant.app/Contents/MacOS/TodoistAssistant" --version "${TODOIST_VERSION}"

      - name: Run macOS install tests
        env:
          TODOIST_PKG_PATH: dist/macos/telemetry-for-todoist-${{ env.TODOIST_VERSION }}-${{ env.TODOIST_ARCH_SUFFIX }}.pkg
          TODOIST_APP_PATH: dist/macos/TodoistAssistant.app
          TODOIST_BREW_FORMULA: Formula/telemetry-for-todoist.rb
          TODOIST_BREW_TARBALL: dist/macos/telemetry-for-todoist-${{ env.TODOIST_VERSION }}-${{ env.TODOIST_ARCH_SUFFIX }}.tar.gz
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          uv run python3 -m pytest tests/macos/test_macos_installers.py

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-for-todoist-macos-${{ matrix.arch }}
          path: |
            dist/macos/telemetry-for-todoist-*.pkg
            dist/macos/telemetry-for-todoist-*.dmg
            dist/macos/telemetry-for-todoist-*.tar.gz

  publish-macos-installers:
    if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/') }}
    needs: build-macos-installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release identity
        run: python -m scripts.check_release_identity
      - uses: actions/download-artifact@v4
        with:
          pattern: telemetry-for-todoist-macos-*
          path: artifacts
          merge-multiple: true
      - name: Attach artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/telemetry-for-todoist-*.pkg
            artifacts/telemetry-for-todoist-*.dmg
            artifacts/telemetry-for-todoist-*.tar.gz
