name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'frontend/package.json'
      - 'scripts/build_android.sh'
      - '.github/workflows/android.yml'
  push:
    branches: [main, v0.4.1-dev]
    paths:
      - 'android/**'
      - 'frontend/package.json'
      - 'scripts/build_android.sh'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - run: bash scripts/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: todoist-assistant-android-debug
          path: dist/android/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
