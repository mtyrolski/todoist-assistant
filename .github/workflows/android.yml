name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'tests/fixtures/completion_scenarios.json'
      - 'frontend/**'
      - 'scripts/build_android.sh'
      - '.github/workflows/android.yml'
  push:
    branches: [main, v0.4.1-dev]
    paths:
      - 'android/**'
      - 'tests/fixtures/completion_scenarios.json'
      - 'frontend/**'
      - 'scripts/build_android.sh'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - run: bash scripts/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: todoist-assistant-android-debug
          path: dist/android/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*

  device-tests:
    name: Android ${{ matrix.api }} interaction tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            width: 1440
            height: 3120
            density: 560
          - api: '37.0'
            width: 1080
            height: 2340
            density: 420
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          pre-emulator-launch-script: printf '%s\n' 'hw.lcd.width=${{ matrix.width }}' 'hw.lcd.height=${{ matrix.height }}' 'hw.lcd.density=${{ matrix.density }}' >> "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd/config.ini"
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            adb shell settings put system font_scale 1.3
            ./android/gradlew -p android --no-daemon connectedDebugAndroidTest
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            node --test frontend/tests/device/android-ui.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-reports-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            frontend/test-results/device/
