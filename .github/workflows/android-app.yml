name: Android App

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build and verify Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android build prerequisites
        uses: actions/cache@v4
        with:
          path: |
            android/.android-sdk
            android/.gradle/android-commandlinetools.zip
            android/.gradle/gradle-*-bin.zip
            android/.gradle/gradle-*
            android/.gradle/jdk17.tar.gz
            android/.jdk
          key: ${{ runner.os }}-android-${{ hashFiles('android/**/*.gradle', 'android/gradle.properties', 'android/settings.gradle', 'scripts/android_*.sh') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Build installable staging APK
        run: |
          make android_staging_apk

      - name: Verify staging APK package and signature
        run: |
          make android_verify_staging_apk

      - name: Enable KVM for Android emulator
        if: runner.os == 'Linux'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available; Android emulator will use software acceleration."
          fi

      - name: Install and launch staging APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./scripts/android_install_smoke.sh android/app/build/outputs/apk/staging/app-staging.apk

      - name: Upload installable staging APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todoist-assistant-android-sideload-apk
          path: android/app/build/outputs/apk/staging/app-staging.apk
          if-no-files-found: error

      - name: Prepare release signing configuration
        id: release-signing
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            ANDROID_SIGNING_KEYSTORE_BASE64 \
            ANDROID_SIGNING_STORE_PASSWORD \
            ANDROID_SIGNING_KEY_ALIAS \
            ANDROID_SIGNING_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping signed release APK; missing secrets: ${missing[*]}"
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              echo "::error::Tagged Android releases require all signing secrets."
              exit 1
            fi
            exit 0
          fi

          echo "::add-mask::${ANDROID_SIGNING_STORE_PASSWORD}"
          echo "::add-mask::${ANDROID_SIGNING_KEY_PASSWORD}"

          keystore_path="${RUNNER_TEMP}/todoist-assistant-release.jks"
          printf '%s' "${ANDROID_SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_SIGNING_STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=${ANDROID_SIGNING_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_PASSWORD=${ANDROID_SIGNING_KEY_PASSWORD}" >> "${GITHUB_ENV}"
          echo "available=true" >> "${GITHUB_OUTPUT}"

      - name: Build signed release APK
        if: steps.release-signing.outputs.available == 'true'
        run: |
          make android_release_apk

      - name: Verify signed release APK package and signature
        if: steps.release-signing.outputs.available == 'true'
        run: |
          make android_verify_release_apk

      - name: Upload signed release APK artifact
        if: steps.release-signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: todoist-assistant-android-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
