[project]
name = "todoist-assistant-core"
version = "0.4.1"
description = "Core Todoist Assistant data library (no dashboard/frontend)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "joblib>=1.5.0",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "tqdm>=4.67.1",
    "typer>=0.15.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = ".." }

[tool.setuptools.packages.find]
where = [".."]
include = ["todoist", "todoist.*"]
exclude = [
    "todoist.web*",
    "todoist.dashboard*",
]
